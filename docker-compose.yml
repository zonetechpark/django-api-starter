# version: "3.7"

services:
  api: &api
    build:
      context: .
      dockerfile: docker/dev/Dockerfile
    command: python manage.py runserver 0.0.0.0:8002
    restart: always
    volumes:
      - ./app:/app
    ports:
      - 8002:8002
    env_file:
      - ./.env
    depends_on:
      - redis
      - db

  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - ./.env
    ports:
      - 5434:5432

  redis:
    image: redis:alpine
    restart: always

  celery:
    <<: *api
    command: celery -A core worker -l info
    restart: always
    ports: []
    volumes:
      - ./app:/app
    env_file:
      - ./.env
    depends_on:
      - redis
      - api

  celery-beat:
    <<: *api
    command: celery -A core beat -l info
    restart: always
    ports: []
    volumes:
      - ./app:/app
    env_file:
      - ./.env
    depends_on:
      - redis
      - celery

  dashboard:
    image: mher/flower
    command: celery flower --broker=redis://redis:6379/0
    restart: always
    ports:
      - 5557:5555
    env_file:
      - ./.env
    depends_on:
      - redis
      - celery

volumes:
  postgres_data: ~
